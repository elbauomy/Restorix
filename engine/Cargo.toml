[package]
name = "restorix-engine"
version = "1.0.0"
edition = "2021"
description = "Deleted-file recovery engine: NTFS, FAT, exFAT, HFS+, APFS, carving, trash and snapshots"

[lib]
name = "restorix_engine"
path = "src/lib.rs"

[[bin]]
name = "restorix-cli"
path = "src/bin/cli.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
walkdir = "2"
filetime = "0.2"
memchr = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }
